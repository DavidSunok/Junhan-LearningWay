name: Build VAE PDF

on:
  push:
    branches: [main]
    paths:
      - "RL/VAE_261004/VAE_261004.md"
      - ".github/workflows/build-vae-pdf.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install PDF dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc texlive-xetex texlive-latex-extra fonts-noto-cjk

      - name: Build PDF
        run: |
          pandoc "RL/VAE_261004/VAE_261004.md"             --pdf-engine=xelatex             -o "RL/VAE_261004/VAE_261004.pdf"

      - name: Commit generated PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "RL/VAE_261004/VAE_261004.pdf"
          if git diff --cached --quiet; then
            echo "PDF unchanged"
          else
            git commit -m "Build VAE_261004 PDF [skip ci]"
            git push
          fi
